[package]
name = "sootmark-indx"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "NTFS directory indexes ($I30 INDX records) for forensics: every entry with its $FILE_NAME times and sizes, and the deleted and renamed entries left in index slack."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/indx"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "ntfs", "indx"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "indx"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
